[package]
name = "xtask"
description = "Repository tooling: the checks and the release packaging CI runs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# deco's own crates, so the documentation generator can drive the real editor and
# the real renderer. They are declared through the workspace, like every other
# crate here. A bare `path` dependency has no version, which cargo records as
# `*`, and the supply-chain policy rejects wildcards.
#
# These crates add no third-party crate that is not already in the graph, and
# none of this is linked into the shipped binary.
deco-config.workspace = true
deco-core.workspace = true
deco-editor.workspace = true
# For the container runtime search, so that `host-test` looks for the same
# runtimes as deco instead of keeping a separate list.
deco-ext.workspace = true
deco-keymap.workspace = true
deco-lsp.workspace = true
deco-scm.workspace = true
deco-theme.workspace = true
deco-tui.workspace = true

anyhow.workspace = true
clap.workspace = true
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
