[package]
name = "xtask"
description = "Repository tooling: the checks and the release packaging CI runs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# deco's own crates, so the documentation generator can drive the real editor and
# the real renderer. Through the workspace, like every other crate here: a bare
# `path` dependency carries no version, which cargo records as `*` and the
# supply-chain policy refuses — a wildcard accepts whatever it is handed.
#
# No third-party crate enters the graph that was not already in it, and none of
# this reaches the shipped binary.
deco-config.workspace = true
deco-core.workspace = true
deco-editor.workspace = true
deco-keymap.workspace = true
deco-lsp.workspace = true
deco-theme.workspace = true
deco-tui.workspace = true

anyhow.workspace = true
clap.workspace = true
flate2 = "1"
sha2 = "0.11"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
