[package]
name = "xtask"
description = "Repository tooling: the checks and the release packaging CI runs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# deco's own crates, so the documentation generator can drive the real editor and
# the real renderer. No third-party crate enters the graph that was not already
# in it, and none of this reaches the shipped binary.
deco-config = { path = "../crates/deco-config" }
deco-core = { path = "../crates/deco-core" }
deco-editor = { path = "../crates/deco-editor" }
deco-keymap = { path = "../crates/deco-keymap" }
deco-lsp = { path = "../crates/deco-lsp" }
deco-theme = { path = "../crates/deco-theme" }
deco-tui = { path = "../crates/deco-tui" }

anyhow.workspace = true
clap.workspace = true
flate2 = "1"
sha2 = "0.10"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
