# Supply-chain policy, enforced in CI by `cargo xtask deny`.
#
# The policy targets a direct or transitive dependency being replaced with
# malicious code. Each of the following checks corresponds to a section below:
#
#   advisories  a dependency has a known, published vulnerability
#   sources     a dependency comes from somewhere other than crates.io
#   bans        an unintended dependency is added, or a crate appears twice
#   licenses    a dependency's licence changes
#
# These checks do not detect a compromised release of an already trusted
# crate. The committed Cargo.lock and `--locked` in CI limit that risk: exact
# versions are reviewed in a diff instead of being resolved on each run.

[graph]
# Only the platforms deco ships for. Without this, `cargo deny` checks every
# target and reports advisories for code that is never built.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
# Fail on any RustSec entry, including unmaintained crates, because an
# unmaintained dependency will not receive fixes.
version = 2
yanked = "deny"

# Every entry needs a reason and a condition for removing it. Without them an
# ignore becomes permanent. Keep the list short so it is reviewed.
ignore = [
    # `ttf-parser` is unmaintained (harfbuzz/ttf-parser#217). It is not a
    # vulnerability, and no exploit is published. No upgrade exists: both
    # paths to it are inside the optional `gui` feature, in upstream crates
    # that this repository does not control.
    #
    #   glyphon -> cosmic-text -> fontdb    -> ttf-parser
    #   winit   -> sctk-adwaita -> ab_glyph -> owned_ttf_parser -> ttf-parser
    #
    # The shipped terminal build does not contain it: `cargo tree -p deco -e
    # normal` without `--features gui` has no ttf-parser node. The advisory
    # names `skrifa` as the replacement, and cosmic-text already depends on
    # skrifa for shaping, so the migration is in progress upstream and a fork
    # is not needed. Remove this entry when cosmic-text and sctk-adwaita no
    # longer depend on it.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, GUI-only, no upgrade available upstream" },

    # `lru` before 0.18.2 has an unsound `LruCache::pop()`: it is not
    # panic-safe, so a stored key whose `Drop` panics leaves dangling pointers
    # in the internal linked list, which a later eviction can dereference.
    #
    # The advisory is `informational = "unsound"`, not a vulnerability, and
    # the code path is unreachable here. The only path to it is inside the
    # optional `gui` feature:
    #
    #   glyphon -> lru
    #
    # glyphon uses it to cache glyph rasterisations under plain-data keys.
    # No type in that cache implements `Drop`, so the described failure cannot
    # occur. `cargo tree -p deco -e normal` without `--features gui` has no lru
    # node, so the shipped terminal build does not contain it.
    #
    # No upgrade exists: glyphon 0.12.0 is the latest release and requires
    # `lru ^0.16.2`, so the resolver rejects
    # `cargo update -p lru --precise 0.18.2`. Remove this entry when a glyphon
    # release accepts lru 0.18.2 or newer.
    { id = "RUSTSEC-2026-0253", reason = "unsound, GUI-only, unreachable, no upgrade available upstream" },
]

[sources]
# Only crates.io is accepted as a publishing path. No dependency currently
# needs another source, and adding a git dependency requires an explicit
# change to this policy.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
# Permissive licences only, limited to those currently in the dependency graph
# rather than every acceptable licence. A new dependency under an unlisted
# licence fails the check, so the addition must be reviewed. This also stops a
# copyleft dependency that appears transitively.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Duplicate major versions are warnings, not errors, because the graphics stack
# requires two versions of several crates. Each duplicate adds code to trust,
# so they are reported.
multiple-versions = "warn"
wildcards = "deny"

# Crates that must never appear. This does not replace review; it catches
# specific unintended dependencies.
deny = [
    # deco routes every network call through the capability model
    # (crates/deco-ext). An HTTP client linked into the editor would bypass
    # it, so one appearing transitively fails the build.
    { name = "openssl-sys", reason = "deco makes no direct TLS connections; see deco-ext's capability model" },
    { name = "openssl", reason = "deco makes no direct TLS connections; see deco-ext's capability model" },
]

# Crates that are allowed to appear more than once, with the reason.
skip = []
