[workspace]
resolver = "2"
members = [
    "crates/deco",
    "crates/deco-core",
    "crates/deco-config",
    "crates/deco-e2e",
    "crates/deco-editor",
    "crates/deco-ext",
    "crates/deco-keymap",
    "crates/deco-lsp",
    "crates/deco-theme",
    "crates/deco-tui",
    "crates/deco-gui",
    "crates/deco-remote",
    "crates/deco-scm",
    "crates/deco-syntax",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# unicode-segmentation 1.13.2 requires Rust 1.85. The 1.13 series fixes grapheme
# boundary handling for ZWJ emoji and regional indicators, which affects cursor
# movement. Keep the minimum Rust version compatible with these fixes.
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/sabas0ba/deco"
authors = ["deco contributors"]

[workspace.dependencies]
deco-core = { path = "crates/deco-core", version = "0.1.0" }
deco-config = { path = "crates/deco-config", version = "0.1.0" }
deco-keymap = { path = "crates/deco-keymap", version = "0.1.0" }
deco-theme = { path = "crates/deco-theme", version = "0.1.0" }
deco-ext = { path = "crates/deco-ext", version = "0.1.0" }
deco-editor = { path = "crates/deco-editor", version = "0.1.0" }
deco-lsp = { path = "crates/deco-lsp", version = "0.1.0" }
deco-remote = { path = "crates/deco-remote", version = "0.1.0" }
deco-scm = { path = "crates/deco-scm", version = "0.1.0" }
deco-syntax = { path = "crates/deco-syntax", version = "0.1.0" }
deco-tui = { path = "crates/deco-tui", version = "0.1.0" }
deco-gui = { path = "crates/deco-gui", version = "0.1.0" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
ropey = "1.6"
unicode-segmentation = "1"
unicode-width = "0.2"

# clap is used only by xtask and is not linked into the editor binary.
# crates/deco/src/cli.rs parses the editor's arguments without this dependency.
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Optimise dependencies in debug builds to reduce the cost of rope operations.
[profile.dev.package."*"]
opt-level = 2
