name: Release

# Packaging is implemented in `cargo xtask dist`, which is unit-tested and runs
# the same way on a contributor's machine:
#
#     cargo xtask dist --target aarch64-apple-darwin
#
# A release can therefore be tested without pushing a tag. This file only
# selects what runs on which runner.
#
# Actions are pinned to commit SHAs; see the note in ci.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, e.g. v0.1.0 — created here if it does not exist
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A release needs a tag, and pushing one needs a checkout, a terminal and
  # push rights. This job allows releasing from the Actions tab instead: run
  # the workflow against `main` and enter the tag. The job creates the tag at
  # the commit the run was dispatched from.
  #
  # The job adds about five seconds of runner time, billed as one minute, to
  # every release. Releases are rare and mistakes in them are expensive, so
  # the extra job is acceptable here.
  #
  # A tag created with GITHUB_TOKEN does not start another workflow run. This
  # run builds the tag, and no second run competes with it.
  tag:
    name: Ensure the tag exists
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag if this run was dispatched for one that is not there
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The push trigger matches `v*`, and `cargo xtask release-notes`
          # reads the version from the tag. Any other name is rejected with an
          # error that names it.
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$TAG' is not a version tag — expected something like v0.1.0"; exit 1 ;;
          esac

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; releasing that rather than moving it."
            exit 0
          fi

          echo "Creating $TAG at $SHA."
          # Annotated rather than lightweight, so the tag records its author,
          # date and message, like `git tag -a` from a checkout.
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f "tag=$TAG" -f "message=deco ${TAG#v}" \
            -f "object=$SHA" -f "type=commit" --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG" -f "sha=$object" >/dev/null
          echo "$TAG created."

  build:
    name: Build ${{ matrix.target }}
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        shell: bash
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      # Builds, stages the binary with the extension host, archives (.tar.gz or
      # .zip by target) and writes the .sha256 next to it.
      - name: Build and package
        run: cargo xtask dist --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deco-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The same ref the build job used. The release notes are read from this
      # checkout's CHANGELOG.md, so a `workflow_dispatch` rebuild of an older tag
      # must check out that tag, not the default branch. Otherwise it would
      # publish the newest version's notes under the old tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Merges the per-artifact checksums into one sorted SHA256SUMS and drops
      # the parts, so the release carries a single verifiable file.
      - name: Collect checksums
        run: cargo xtask checksums

      # The release text is this version's section of CHANGELOG.md, so the
      # repository and the release describe the version identically. A tag
      # without a section fails here instead of publishing an empty release.
      #
      # Written outside `dist`, which is uploaded wholesale as assets.
      - name: Build the release notes
        id: notes
        run: >
          cargo xtask release-notes
          --tag ${{ github.event.inputs.tag || github.ref_name }}

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: target/release-notes.md
          # Disabled because it appends every commit since the previous tag. For
          # the first release that is the entire history, which hides the notes.
          generate_release_notes: false
          # Set explicitly. A release created in the web UI keeps the value of
          # that form's pre-release checkbox, and this action preserves fields
          # it is not given. This caused 0.1.0 to be published as a pre-release,
          # so `/releases/latest/`, the URL in the README, returned 404.
          #
          # `xtask/src/release.rs` derives the value from the tag using semver's
          # rule.
          prerelease: ${{ steps.notes.outputs.prerelease }}
          files: dist/*
          # A release with a platform missing is worse than no release, so an
          # upload with no matching files fails.
          fail_on_unmatched_files: true
