name: Release

# The packaging itself lives in `cargo xtask dist`, which is unit-tested and
# runs identically on a contributor's machine:
#
#     cargo xtask dist --target aarch64-apple-darwin
#
# so a release can be rehearsed without pushing a tag. This file only decides
# what runs where.
#
# Actions are pinned to commit SHAs; see the note in ci.yml.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (must already exist)
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}

      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        shell: bash
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      # Builds, stages the binary with the extension host, archives (.tar.gz or
      # .zip by target) and writes the .sha256 next to it.
      - name: Build and package
        run: cargo xtask dist --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deco-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Merges the per-artifact checksums into one sorted SHA256SUMS and drops
      # the parts, so the release carries a single verifiable file.
      - name: Collect checksums
        run: cargo xtask checksums

      # The release's text is the section CHANGELOG.md already has for this
      # version, so the repository and the release cannot describe the same
      # version differently. A tag with no section fails here rather than
      # publishing a release that says nothing.
      #
      # Written outside `dist`, which is uploaded wholesale as assets.
      - name: Build the release notes
        run: >
          cargo xtask release-notes
          --tag ${{ github.event.inputs.tag || github.ref_name }}

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body_path: target/release-notes.md
          # Off, because it appends every commit since the previous tag — for
          # the first release that is the entire history, which buries the
          # notes rather than adding to them.
          generate_release_notes: false
          files: dist/*
          # A release missing the platform someone came for is worse than no
          # release, so an empty upload is a failure rather than a quiet one.
          fail_on_unmatched_files: true
