name: CI

# Every step here is a `cargo xtask` subcommand or a package script, so any
# failure can be reproduced locally with the same command — see xtask/src/main.rs.
#
# Actions are pinned to commit SHAs rather than tags. A tag is mutable, so a
# tag reference such as `@v4` runs whatever the action's repository puts there.
# The trailing comment records the release of each SHA, and
# .github/dependabot.yml updates the pins.
#
#
# What runs when, and why
# -----------------------
#
# Actions bills each job by wall-clock minutes, rounded up. At this
# repository's size the rounding is most of the cost: a pull request run does
# about nine minutes of work, but split over ten jobs it was billed as
# thirteen, because each runner paid for a checkout, a toolchain, a cache
# restore and a partial final minute. The workflow therefore uses fewer
# runners per event, and runs each check on the least frequent event that
# still detects the failures it looks for.
#
#   every push to a pull request   `check` and `test`. Formatting, lints,
#                                  rustdoc, commit messages, the documentation
#                                  images, the workspace test suite and the
#                                  extension host. These are the per-commit
#                                  regression checks.
#
#   a merge to main                `test` alone. Actions runs a pull request's
#                                  jobs against the merge of the head and the
#                                  base, so `check` has already run on this
#                                  tree. The tests detect the remaining case:
#                                  main changed after that run and the two
#                                  changes conflict semantically without a
#                                  merge conflict.
#
#   daily, on main                 `cross`, `cross-build`, `msrv` and
#                                  `supply-chain`. None of these depends on
#                                  individual commits. The Windows and macOS
#                                  substitutes and the packaging path break
#                                  when a dependency or a target changes. The
#                                  advisory database changes independently of
#                                  this repository. The MSRV changes when a
#                                  dependency raises its own. A daily run is
#                                  frequent enough for all four, and `ci:full`
#                                  runs them on a branch that needs them.
#
#   a pull request labelled        everything above, plus `test-platforms` and
#   `ci:full`, or a manual         `cross-build-platforms` on real macOS and
#   `workflow_dispatch`            Windows runners.
#
#   a release tag                  everything except the two packaging jobs,
#                                  `cross-build` and `cross-build-platforms`.
#                                  release.yml builds all seven targets with the
#                                  same `cargo xtask dist` on the same tag, and
#                                  its output is what ships. Building them here
#                                  as well duplicated the most expensive jobs
#                                  in the repository, four of them on premium
#                                  runners.
#
# The tiers are set by the cost of the premium runners. A macOS minute bills at
# ten times a Linux minute and a Windows minute at two, so these runners are
# used when a release is built. Between tags `cargo xtask cross` is used
# instead. It runs `cargo check` for all four shipped Apple and Windows
# triples, which needs no SDK because it stops before linking. It also builds
# the test suite for `x86_64-pc-windows-gnu` and runs it under Wine, which
# executes the `#[cfg(windows)]` paths, including process spawning, in real
# Windows binaries.
#
# `cargo xtask cross` does not cover macOS at runtime, the MSVC ABI, or
# differences between Wine's Win32 and Microsoft's; `xtask/src/cross.rs`
# describes the gaps. Because it runs daily, a regression in those paths can
# reach main and remain undetected for up to a day, and one specific to real
# macOS or MSVC can remain undetected until a tag. Label a pull request
# `ci:full` to run the premium jobs early. Do this for platform-specific
# changes and for dependency updates, which affect `msrv` and `supply-chain`.

on:
  push:
    branches: [main]
    tags: ['v*']
  # `labeled` lets adding `ci:full` start the platform jobs without pushing an
  # empty commit. It fires for any label, so every job below checks that the
  # added label is `ci:full`. A runner that starts and then skips its steps is
  # still billed.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # The daily tier. A schedule always runs on the default branch (main).
  # 03:11 rather than on the hour, because scheduled runs on the hour are
  # queued longer.
  schedule:
    - cron: '11 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# Each job has its own copy of the condition that selects its tier. The copies
# cannot be shared: Actions does not expand YAML anchors, `env` is not readable
# from a job-level `if`, and a gate job that exposes the condition as an output
# would start a runner only to compute a boolean. That costs a rounded-up
# minute, about a fifth of a pull request's bill at these tier sizes.
#
# Every pull-request condition repeats this clause:
#
#     github.event.action != 'labeled' || github.event.label.name == 'ci:full'
#
# The `labeled` trigger fires for every label. Without the clause, each label
# added to a pull request would start a full run of unchanged jobs.

jobs:
  # Per-commit. Checks that depend only on this commit, reported before merge.
  #
  # The commit-message and documentation checks are steps rather than separate
  # jobs. A separate job would run checkout, the toolchain and the cache again
  # (three more third-party actions for a check that reads strings), rebuild
  # xtask, and be billed a rounded-up minute for about a second of work.
  #
  # The MSRV check is in the daily tier, not here, because the MSRV changes when
  # a dependency raises its own, not when this repository changes.
  check:
    name: Format, lint and docs
    if: >-
      (github.event_name == 'pull_request'
       && (github.event.action != 'labeled'
           || github.event.label.name == 'ci:full'))
      || startsWith(github.ref, 'refs/tags/v')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch the full history so the commit-message check below can find
          # the merge base with the base branch. A shallow clone does not
          # contain it.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev
      - run: cargo xtask ci --lint-only
      # Only on a pull request. A push to main has no base range to compare,
      # and the convention was adopted partway through the history, so earlier
      # commits would fail the check.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: cargo xtask commitlint --range "origin/${{ github.base_ref }}..HEAD"
      # The editor renders the documentation's animations. This check fails when
      # a behaviour change is committed without regenerating them.
      - name: Documentation is up to date
        run: cargo xtask docs --check

  # Per-commit, and the only job that also runs on a merge to main. Only the
  # tests detect a semantic conflict between two branches that each merged
  # cleanly.
  #
  # The extension host's suite is a step rather than a separate job for the
  # reason given for `check`. It is also the longest single step in CI, so
  # running it with the short workspace suite uses time in a billed minute that
  # would otherwise be rounded up.
  test:
    name: Test (ubuntu-latest)
    if: >-
      (github.event_name == 'pull_request'
       && (github.event.action != 'labeled'
           || github.event.label.name == 'ci:full'))
      || github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22, not 20: the host passes `--permission`, which is the flag's
          # stable name from v22.13. See `extension-host/package.json`.
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev
      # The GUI crate's tests cover key mapping and layout, neither of which
      # needs a display, so --all-features is safe on a headless runner.
      - run: cargo xtask ci --test-only
      # `cargo xtask host-test` runs the host's own suite and the Rust side
      # against the real host. This is the only test of the two together, and
      # the only job with Node installed.
      - run: cargo xtask host-test

  # Daily on main, and on demand. Checks Windows and macOS from a Linux runner.
  #
  # `cargo xtask cross` with no flag runs both parts: the type check for every
  # shipped Apple and Windows triple, then the Wine run. One job shares the
  # checkout and the cache between them. The type check runs first, so a type
  # error fails the job before the slower Wine run.
  cross:
    name: Windows and macOS from Linux
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (contains(github.event.pull_request.labels.*.name, 'ci:full')
          && (github.event.action != 'labeled'
              || github.event.label.name == 'ci:full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          # The four targets of the type check, plus the GNU triple for the Wine
          # run. cross.rs has its own list. A target added there but not here
          # fails on the missing `std`, and the error shows the
          # `rustup target add` command to run.
          targets: >-
            x86_64-pc-windows-msvc,
            aarch64-pc-windows-msvc,
            x86_64-apple-darwin,
            aarch64-apple-darwin,
            x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cross
      # `wine64` rather than `wine`. The `wine` metapackage depends on the
      # 32-bit stack, which requires the i386 architecture and a second Wine
      # for binaries this repository does not build. `wine64` installs to
      # /usr/lib/wine/wine64 without changing PATH; cross.rs checks that path
      # last.
      - name: Install the MinGW toolchain and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 wine64
      - run: cargo xtask cross

  # Daily. The MSRV changes when a dependency raises its own, which arrives as
  # a dependabot pull request. Label that pull request `ci:full` to run this
  # job on it.
  msrv:
    name: Minimum supported Rust version
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (contains(github.event.pull_request.labels.*.name, 'ci:full')
          && (github.event.action != 'labeled'
              || github.event.label.name == 'ci:full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The MSRV applies to the terminal editor. deco-gui follows wgpu's much
      # newer minimum, and xtask is not shipped, so both are excluded. Cargo
      # is invoked directly because xtask does not build on this toolchain.
      - run: cargo check --locked --workspace --exclude deco-gui --exclude xtask

  # Daily. A newly published advisory can fail this job without any change in
  # the repository, so it runs on a schedule. Running it on every push checked
  # the same dependency graph several times a day.
  supply-chain:
    name: Supply chain
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (contains(github.event.pull_request.labels.*.name, 'ci:full')
          && (github.event.action != 'labeled'
              || github.event.label.name == 'ci:full'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version ^0.18
      # RustSec advisories, non-crates.io sources, banned crates and licences.
      # See deny.toml for the purpose of each check.
      - run: cargo xtask deny

  # Daily, and not on a tag. Packaging usually breaks when a target or a cross
  # toolchain changes, not when the editor changes. A daily run detects this
  # before a release. On a tag, release.yml builds the same three targets with
  # the same `cargo xtask dist`, so building them here would duplicate that
  # work.
  #
  # Only the terminal binary is cross-built: a cross toolchain has no
  # target-side graphics libraries for the GPU frontend.
  cross-build:
    name: Cross build ${{ matrix.target }}
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (contains(github.event.pull_request.labels.*.name, 'ci:full')
          && (github.event.action != 'labeled'
              || github.event.label.name == 'ci:full'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        shell: bash
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
      - run: cargo xtask dist --target ${{ matrix.target }}

  # Premium, on a tag and on demand. The test suite on real macOS and Windows.
  # This is a separate job, not a matrix in `test`, because a job's `if` cannot
  # read the `matrix` context. A matrix entry cannot exclude itself, and a job
  # that starts only to skip its steps is still billed.
  test-platforms:
    name: Test (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || (contains(github.event.pull_request.labels.*.name, 'ci:full')
          && (github.event.action != 'labeled'
              || github.event.label.name == 'ci:full'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo xtask ci --test-only

  # Premium, on demand only. A tag is excluded for the reason given for
  # `cross-build`: release.yml runs all four builds on the same tag, and these
  # are the most expensive jobs in the repository. This job runs only on the
  # two events release.yml does not cover: a pull request labelled `ci:full`,
  # and a manual run.
  cross-build-platforms:
    name: Cross build ${{ matrix.target }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || (contains(github.event.pull_request.labels.*.name, 'ci:full')
          && (github.event.action != 'labeled'
              || github.event.label.name == 'ci:full'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      - run: cargo xtask dist --target ${{ matrix.target }}
