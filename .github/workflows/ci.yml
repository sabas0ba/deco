name: CI

# Every step here is a `cargo xtask` subcommand or a package script, so any
# failure can be reproduced locally with the same command — see xtask/src/main.rs.
#
# Actions are pinned to commit SHAs rather than tags: a tag is mutable, so
# `@v4` means "whatever that repository decides to put there", which is write
# access to this workflow. The trailing comment records which release each SHA
# was, and .github/dependabot.yml keeps them moving.
#
# Platform coverage is deliberately uneven, because the runners are not priced
# alike: a macOS minute bills at ten times a Linux one and a Windows minute at
# two. The premium runners are reserved for the moment their answer is worth
# what it costs — which is the moment something ships:
#
#   * every push to a pull request  — Linux, and the Windows and macOS targets
#                                     as `cross-check` and `wine-test` can
#                                     reach them from a Linux runner
#   * a merge to main               — the same
#   * a pull request labelled `ci:full` — real macOS and Windows runners, on demand
#   * `workflow_dispatch`           — the same
#   * a release tag                 — the same, here and in release.yml
#
# So no tag is ever cut without every platform having been built and tested on
# its own hardware. Between tags the substitute is `cargo xtask cross`: a
# `cargo check` for all four shipped Apple and Windows triples, which needs no
# SDK because it stops before the link step, and the test suite built for
# `x86_64-pc-windows-gnu` and run under Wine — real Windows binaries executing
# the `#[cfg(windows)]` paths, process spawning included.
#
# What that substitute does not reach is macOS at runtime, the MSVC ABI, and
# anywhere Wine's Win32 differs from Microsoft's; `xtask/src/cross.rs` says so
# in full. A regression confined to those can now land on main and wait until a
# tag to surface, which is the cost this trade accepts. Label a pull request
# `ci:full` to pay for the real thing early — worth doing for anything
# platform-specific.

on:
  push:
    branches: [main]
    # The premium half of the matrix runs here rather than on every merge, so a
    # tag is still built and tested on every platform before release.yml
    # packages it.
    tags: ['v*']
  # `labeled` is here so that adding `ci:full` starts the platform jobs without
  # needing an empty commit to push. It fires for any label, but the run it
  # starts is the cheap Linux one unless that is the label that was added.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the merge base with the base branch exists for
          # the commit-message check below. A shallow clone has nothing to diff
          # against.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev
      - run: cargo xtask ci --lint-only
      # Deliberately a step in this job rather than a job of its own. A separate
      # job would re-run checkout, the toolchain and the cache — three more
      # third-party actions executing, for a check that reads strings — and
      # would rebuild xtask, which this job has already built.
      #
      # Only on a pull request: there is nothing to compare a push to main
      # against, and the convention was adopted partway through this history, so
      # the earlier commits would fail a check they were never held to.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: cargo xtask commitlint --range "origin/${{ github.base_ref }}..HEAD"
      # Also a step rather than a job, for the same reason. The documentation's
      # animations are rendered by the editor itself, so a behaviour change that
      # nobody regenerated them for would otherwise leave the documentation
      # describing an editor that no longer exists.
      - name: Documentation is up to date
        run: cargo xtask docs --check

  test:
    name: Test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev
      # The GUI crate's tests cover key mapping and layout, neither of which
      # needs a display, so --all-features is safe on a headless runner.
      - run: cargo xtask ci --test-only

  # The same job on the runners that bill at a premium, held back to the events
  # in the header comment. Kept separate rather than folded into the matrix
  # above because a job's `if` cannot read the `matrix` context, so a matrix
  # entry cannot exclude itself — and a job that starts only to skip its steps
  # has already paid for the runner.
  #
  # The condition is repeated verbatim on cross-build-platforms below. There is
  # no way to share it: YAML anchors are not expanded by Actions, `env` is not
  # readable from a job-level `if`, and a gate job to carry it as an output
  # would be a third runner started to compute one boolean.
  test-platforms:
    name: Test (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo xtask ci --test-only

  # What a Linux runner can say about the platforms it is not. `cargo check`
  # never invokes a linker, so all four shipped Apple and Windows triples can be
  # compiled here with nothing installed but their prebuilt `std` — no MSVC, no
  # Xcode, at Linux prices. It covers the code a Linux build never sees at all:
  # the `%APPDATA%` branch of the config paths, the `cmd`-not-`ctrl` branch of
  # the keymap, and the frontend's per-platform windowing, which is why this
  # runs --all-features.
  cross-check:
    name: Check Windows and macOS targets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          # The same four triples as cross-build-platforms, and as the release
          # matrix. cross.rs keeps its own list; a target added there and not
          # here fails on the missing `std` with the `rustup target add` to run.
          targets: >-
            x86_64-pc-windows-msvc,
            aarch64-pc-windows-msvc,
            x86_64-apple-darwin,
            aarch64-apple-darwin
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: cross-check
      - run: cargo xtask cross --check-only

  # The other half: the test suite as actual Windows binaries. Built for the GNU
  # target with MinGW — the one a Linux host can link — and executed through
  # Wine by way of cargo's target runner, so `#[cfg(windows)]` code really runs,
  # child processes included.
  #
  # Wine is not Windows and the GNU ABI is not MSVC, so this does not replace
  # the tagged run on a real runner; what it replaces is having no runtime
  # signal at all between tags. See xtask/src/cross.rs for the full list of what
  # it does not cover.
  wine-test:
    name: Test the Windows target under Wine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: wine
      # `wine64` rather than `wine`: the metapackage depends on the 32-bit
      # stack, which means enabling the i386 architecture and downloading a
      # second Wine for binaries this repository does not build. It installs to
      # /usr/lib/wine/wine64 without touching PATH, which is where cross.rs
      # looks last.
      - name: Install the MinGW toolchain and Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 wine64
      - run: cargo xtask cross --wine-only

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from the workspace manifest
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # The terminal editor is what the MSRV promise covers. deco-gui tracks
      # wgpu's much newer minimum, and xtask is tooling rather than shipped
      # code, so neither is bound by it. Invoked directly rather than through
      # xtask because xtask itself would not build on this toolchain.
      - run: cargo check --locked --workspace --exclude deco-gui --exclude xtask

  extension-host:
    name: Extension host
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      # The same script `cargo xtask host-test` delegates to.
      - run: npm test
        working-directory: extension-host

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version ^0.18
      # RustSec advisories, non-crates.io sources, banned crates and licences.
      # See deny.toml for what each check is defending against.
      - run: cargo xtask deny

  cross-build:
    name: Cross build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        shell: bash
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"
      # Packaging on every PR, not just on a tag, so a break in the release
      # path is caught here rather than during a release. Only the terminal
      # binary is cross-built: a cross toolchain has no target-side graphics
      # libraries for the GPU frontend.
      - run: cargo xtask dist --target ${{ matrix.target }}

  # The Apple and Windows halves of the release matrix, on the same schedule as
  # test-platforms. `cargo xtask dist` is shared with release.yml, and the three
  # Linux targets above exercise it on every pull request, so what is deferred
  # here is the target-specific half of the packaging — which is also the half
  # that a release tag rebuilds from scratch anyway. Compiling these four
  # targets, as opposed to linking and packaging them, is what cross-check does
  # on every push.
  cross-build-platforms:
    name: Cross build ${{ matrix.target }}
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}
      - run: cargo xtask dist --target ${{ matrix.target }}
