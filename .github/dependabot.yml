version: 2

# Actions are pinned to commit SHAs. Pins must be updated, or they become
# unpatched dependencies. Dependabot updates both the SHA and the trailing
# version comment.
#
# The trailing comment must name a release: `# v2.9.2`, not `# v2`. With a
# specific version, dependabot updates to the next release and rewrites both.
# With a floating major version, it has no version to start from and pins the
# head of the default branch, which can put an unreleased commit in a workflow.
#
# The prefixes are types that xtask/src/commitlint.rs accepts, because the same
# check runs on dependabot's pull requests. `build` is the Conventional Commits
# type for a dependency change, and `ci` is the type for workflow changes.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      # One PR for the GPU stack. wgpu, winit and glyphon must be updated
      # together because glyphon and wgpu share types.
      graphics:
        patterns:
          - wgpu
          - winit
          - glyphon

  - package-ecosystem: npm
    directory: /extension-host
    schedule:
      interval: weekly
    commit-message:
      prefix: build
