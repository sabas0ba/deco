[package]
name = "deco-remote"
description = "Remote authorities and transports for deco: SSH, WSL and containers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# For `fs.search`: the server matches with `deco_core::search::find_all`, the
# same function the find bar and the local project search use. Two definitions
# of what counts as a match would drift, and a search that finds different
# things depending on which machine the files are on is worse than none.
deco-core.workspace = true
# For `settings.read`: the server resolves *its own* machine-settings path with
# the same rules the editor uses for a configuration directory, so the file a
# person edits on the remote is the file a connected session is served.
deco-config.workspace = true
deco-scm.workspace = true
# For `--remote-install-download`: the checksum of a downloaded release is
# computed here rather than by whatever `sha256sum` is on the PATH. The transfer
# and the decompression are chores that can be delegated; deciding whether the
# bytes are the ones the project published is the question being asked, and an
# editor that asked something else whether it had checked would not be checking.
#
# The same crate `cargo xtask dist` writes SHA256SUMS with, so the hash is
# produced and verified by one implementation.
sha2 = "0.11"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
