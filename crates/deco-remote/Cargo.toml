[package]
name = "deco-remote"
description = "Remote authorities and transports for deco: SSH, WSL and containers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# For `fs.search`: the server matches with `deco_core::search::find_all`, the
# same function the find bar and the local project search use. Remote and local
# searches therefore use one definition of a match.
deco-core.workspace = true
# For `settings.read`: the server resolves the remote machine's settings path
# with the same configuration-directory rules as the editor. A connected session
# is served the same file that is edited on the remote.
deco-config.workspace = true
deco-scm.workspace = true
# For `--remote-install-download`: the checksum of a downloaded release is
# computed in-process, not by a `sha256sum` found on the PATH. Transfer and
# decompression may use external tools. Checksum verification does not.
#
# `cargo xtask dist` uses the same crate to write SHA256SUMS, so one
# implementation produces and verifies the hash.
sha2 = "0.11"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
