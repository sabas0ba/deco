[package]
name = "deco-e2e"
description = "End-to-end scenarios: a real configuration directory, a real workspace, real keystrokes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Nothing here is linked into a shipped binary. The crate drives the editor as a
# user does. It is not published because a test harness on crates.io would have
# a name that looks like part of the editor.
publish = false

[dependencies]
# The startup path under test: argument parsing, configuration loading, and the
# resulting session. Used as a library so that a scenario runs the same code as
# `deco notes.md` instead of a copy of it.
deco = { path = "../deco", version = "0.1.0" }
deco-config.workspace = true
deco-core.workspace = true
deco-editor.workspace = true
deco-keymap.workspace = true
# Language server scenarios assert on the positions and diagnostics the server
# sent, which use this crate's types.
deco-lsp.workspace = true
# For `launch_remote`: a remote session scenario starts a real server and
# connects to it instead of using a fake server.
deco-remote.workspace = true
deco-theme.workspace = true
deco-tui.workspace = true
# Keystrokes are delivered in the same form as from the terminal, so the harness
# builds crossterm events rather than the chords they are translated into.
crossterm.workspace = true
# Startup returns an `anyhow::Result`, and a scenario about a failed startup
# must hold its error.
anyhow.workspace = true
# The scenario option that installs a language server writes its definition into
# `settings.json`. Backslashes in a Windows path must be escaped so the path
# reads back correctly.
serde_json.workspace = true
