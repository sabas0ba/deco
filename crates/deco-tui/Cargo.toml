[package]
name = "deco-tui"
description = "Terminal frontend for the deco editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
deco-config.workspace = true
deco-core.workspace = true
deco-editor.workspace = true
deco-ext.workspace = true
deco-keymap.workspace = true
deco-lsp.workspace = true
# Remote mode: the same event loop drives a session whose files are on another
# machine, so the client that fetches them is in this crate rather than in the binary.
deco-remote.workspace = true
deco-scm.workspace = true
deco-syntax.workspace = true
deco-theme.workspace = true
anyhow.workspace = true
crossterm.workspace = true
# Already a dependency of every deco crate that implements a protocol. Extension
# host messages are JSON, and starting a host requires building their parameters.
serde_json.workspace = true
unicode-width.workspace = true
