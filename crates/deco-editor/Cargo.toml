[package]
name = "deco-editor"
description = "Frontend-agnostic editor session: documents, views, and the command set"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
deco-config.workspace = true
deco-core.workspace = true
deco-keymap.workspace = true
deco-lsp.workspace = true
deco-scm.workspace = true
deco-syntax.workspace = true
deco-theme.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# The local time zone, for snippet date variables; see src/clock.rs. Both
# crates are already in the lockfile through other dependencies.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
