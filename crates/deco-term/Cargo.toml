[package]
name = "deco-term"
description = "The integrated terminal's parts: a VT parser, a screen model, key encoding and a pseudo-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
deco-keymap.workspace = true
unicode-width.workspace = true

# The pseudo-terminal is opened through the operating system's own interface;
# see src/pty.rs. Both crates are already in the lockfile.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
