[package]
name = "deco"
description = "A lightweight, VS Code-compatible editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "deco"

[[bin]]
name = "deco"
path = "src/main.rs"

[dependencies]
deco-config.workspace = true
deco-editor.workspace = true
deco-keymap.workspace = true
# The far end of remote development: `deco --server` is this binary too, because
# one binary on the remote is one thing to install and one version to match.
deco-remote.workspace = true
deco-theme.workspace = true
deco-tui.workspace = true
deco-gui = { workspace = true, optional = true }
anyhow.workspace = true

[features]
# The GPU frontend pulls in wgpu and winit, which dominate build time. It is
# opt-in so that `cargo build` for the terminal editor stays fast.
default = []
gui = ["dep:deco-gui"]

[dev-dependencies]
# For the server-mode tests, which build the JSON a client would send. Already in
# the graph through deco-remote; a dev-dependency because the binary itself never
# constructs a message by hand.
serde_json.workspace = true
# For the search options a remote search takes. Already in the graph through
# deco-remote, and a dev-dependency for the same reason: the binary passes the
# options through rather than naming them itself.
deco-core.workspace = true
# The end-to-end harness, for scenarios that need this package's binary as the
# far end of a remote session. A dev-dependency cycle — deco-e2e depends on this
# crate's library — which Cargo allows and which is the only way a scenario can
# have both the editor's own startup and a real `deco --server` to talk to.
deco-e2e = { path = "../deco-e2e", version = "0.1.0" }
